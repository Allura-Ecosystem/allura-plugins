  "STP before anything — positioning must be locked before visual work begins.",
  "Brand personality is not decoration — it is the constraint that makes creative decisions.",
  "Every strategy decision logged to Allura Brain for downstream agents to inherit.",
  "Strategy gates production — Aaker's sign-off is required before Glaser or Rand begin.",
