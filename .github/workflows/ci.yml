name: CI — Allura Plugins

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-plugins:
    name: Validate plugin structure (5 invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate marketplace, manifests, content, paths, versions
        run: python3 scripts/validate_manifests.py

      - name: Validate JSON files parse
        run: |
          set -e
          errors=0
          for f in $(find . -name "plugin.json" -not -path "*/node_modules/*" -not -path "*/__pycache__/*"); do
            python3 -m json.tool "$f" > /dev/null 2>&1 || { echo "❌ Invalid JSON: $f"; errors=$((errors + 1)); }
          done
          echo "Validated $(find . -name 'plugin.json' -not -path '*/node_modules/*' -not -path '*/__pycache__/*' | wc -l) plugin.json files"
          [ $errors -eq 0 ] && echo "✅ All JSON valid" || { echo "❌ $errors errors"; exit 1; }

  validate-docs:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README and LICENSE exist
        run: |
          [ -f "README.md" ] && echo "✅ README.md exists" || { echo "❌ Missing README.md"; exit 1; }
          [ -f "LICENSE" ] && echo "✅ LICENSE exists" || { echo "❌ Missing LICENSE"; exit 1; }

  no-secrets:
    name: No secrets in repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check no credentials committed
        run: |
          set -e
          if grep -rE "sk-ant-|sk-proj-|ntn_[a-zA-Z0-9]{10,}|ANTHROPIC_API_KEY=['\"]?[a-zA-Z0-9]" . --include="*.json" --include="*.md" --include="*.ts" -l 2>/dev/null; then
            echo "❌ Possible API keys found"
            exit 1
          fi
          echo "✅ No credentials detected"