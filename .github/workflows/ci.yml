name: CI — Allura Plugins

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-plugins:
    name: Validate plugin structure (5 invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate marketplace, manifests, content, paths, versions
        run: |
          set -e
          python3 <<'PYEOF'
          import json, os, sys, re

          errors = []
          warnings = []

          # --- Invariant 1: marketplace.json parses and every source resolves inside the repo ---
          mp_path = ".claude-plugin/marketplace.json"
          if not os.path.exists(mp_path):
              errors.append(f"marketplace.json missing at {mp_path}")
          else:
              try:
                  mp = json.load(open(mp_path))
              except Exception as e:
                  errors.append(f"marketplace.json does not parse: {e}")
                  mp = {"plugins": []}

              for p in mp.get("plugins", []):
                  src = p.get("source", "")
                  name = p.get("name", "?")
                  if src.startswith("..") or src.startswith("/"):
                      errors.append(f"I1: {name} source '{src}' escapes repo root")
                  elif not os.path.isdir(src):
                      errors.append(f"I1: {name} source '{src}' does not resolve to a directory")
                  else:
                      print(f"  I1 OK: {name} -> {src}")

              # --- Invariant 4: versions in marketplace match plugin.json ---
              for p in mp.get("plugins", []):
                  src = p.get("source", "")
                  name = p.get("name", "?")
                  mp_ver = p.get("version", "")
                  pj = os.path.join(src, ".claude-plugin", "plugin.json")
                  if os.path.exists(pj):
                      try:
                          pj_data = json.load(open(pj))
                          pj_ver = pj_data.get("version", "")
                          if pj_ver != mp_ver:
                              errors.append(f"I4: {name} marketplace v{mp_ver} != plugin.json v{pj_ver}")
                          else:
                              print(f"  I4 OK: {name} v{pj_ver}")
                      except Exception as e:
                          errors.append(f"I4: {name} plugin.json parse error: {e}")

          # --- Invariant 2: every file in agents/commands/skills dirs is referenced by manifest ---
          plugin_dirs = []
          for p in mp.get("plugins", []):
              src = p.get("source", "")
              if os.path.isdir(src):
                  plugin_dirs.append(src)

          for pd in plugin_dirs:
              pj = os.path.join(pd, ".claude-plugin", "plugin.json")
              if not os.path.exists(pj):
                  errors.append(f"I2: {pd} has no .claude-plugin/plugin.json")
                  continue
              data = json.load(open(pj))
              declared_agents = set()
              declared_cmds = set()

              agents_field = data.get("agents", [])
              if isinstance(agents_field, list):
                  for a in agents_field:
                      declared_agents.add(os.path.basename(a))
              elif isinstance(agents_field, str):
                  agents_dir = os.path.join(pd, agents_field)
                  if os.path.isdir(agents_dir):
                      for f in os.listdir(agents_dir):
                          if f.endswith(".md"):
                              declared_agents.add(f)

              for c in data.get("commands", []):
                  declared_cmds.add(os.path.basename(c))

              # Check agents dir for orphans (only when agents is an explicit list, not a dir string)
              agents_dir = os.path.join(pd, "agents")
              if isinstance(agents_field, list) and os.path.isdir(agents_dir):
                  for f in os.listdir(agents_dir):
                      if f.endswith(".md") and f not in declared_agents:
                          errors.append(f"I2: {pd}/agents/{f} is on disk but not in manifest agents[]")

              # Check commands dir for orphans (top-level only — nested dirs don't load)
              cmds_dir = os.path.join(pd, "commands")
              if os.path.isdir(cmds_dir):
                  for f in os.listdir(cmds_dir):
                      if f.endswith(".md") and f not in declared_cmds:
                          errors.append(f"I2: {pd}/commands/{f} is on disk but not in manifest commands[]")
                  # Check for nested dirs (won't load)
                  for entry in os.listdir(cmds_dir):
                      nested = os.path.join(cmds_dir, entry)
                      if os.path.isdir(nested):
                          for nf in os.listdir(nested):
                              if nf.endswith(".md"):
                                  errors.append(f"I2: {pd}/commands/{entry}/{nf} is nested — command loader won't find it")

              # Check every declared path exists
              if isinstance(agents_field, list):
                  for a in agents_field:
                      if not os.path.exists(os.path.join(pd, a)):
                          errors.append(f"I2: {pd} declares agent {a} but file missing")
              for c in data.get("commands", []):
                  if not os.path.exists(os.path.join(pd, c)):
                      errors.append(f"I2: {pd} declares command {c} but file missing")

              print(f"  I2 OK: {pd} manifest <-> disk consistent")

          # --- Invariant 3: no machine-specific paths in shipped plugin dirs ---
          for pd in plugin_dirs:
              for root, dirs, files in os.walk(pd):
                  dirs[:] = [d for d in dirs if d not in ("node_modules", "__pycache__")]
                  for f in files:
                      fpath = os.path.join(root, f)
                      try:
                          content = open(fpath, "r", errors="ignore").read()
                      except:
                          continue
                      for m in re.finditer(r"/home/(?!user/)[^/\s\"']+|/media/[^/\s\"']+", content):
                          errors.append(f"I3: {fpath} contains machine path: {m.group(0)}")

          # --- Invariant 5: one runtime's config does not ship inside another runtime's plugin ---
          for pd in plugin_dirs:
              source_dir = os.path.join(pd, "source")
              if os.path.isdir(source_dir):
                  errors.append(f"I5: {pd}/source/ exists — runtime config inside a Claude plugin (layer violation)")
              opencode_json = os.path.join(pd, "opencode.json")
              if os.path.exists(opencode_json):
                  errors.append(f"I5: {pd}/opencode.json exists — OpenCode config inside a Claude plugin")

          print()
          if errors:
              print("❌ VALIDATION FAILED")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)
          else:
              print("✅ All 5 invariants pass")
          PYEOF

      - name: Validate JSON files parse
        run: |
          set -e
          errors=0
          for f in $(find . -name "plugin.json" -not -path "*/node_modules/*" -not -path "*/__pycache__/*"); do
            python3 -m json.tool "$f" > /dev/null 2>&1 || { echo "❌ Invalid JSON: $f"; errors=$((errors + 1)); }
          done
          echo "Validated $(find . -name 'plugin.json' -not -path '*/node_modules/*' -not -path '*/__pycache__/*' | wc -l) plugin.json files"
          [ $errors -eq 0 ] && echo "✅ All JSON valid" || { echo "❌ $errors errors"; exit 1; }

  validate-docs:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check README and LICENSE exist
        run: |
          [ -f "README.md" ] && echo "✅ README.md exists" || { echo "❌ Missing README.md"; exit 1; }
          [ -f "LICENSE" ] && echo "✅ LICENSE exists" || { echo "❌ Missing LICENSE"; exit 1; }

  no-secrets:
    name: No secrets in repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check no credentials committed
        run: |
          set -e
          if grep -rE "sk-ant-|sk-proj-|ntn_[a-zA-Z0-9]{10,}|ANTHROPIC_API_KEY=['\"]?[a-zA-Z0-9]" . --include="*.json" --include="*.md" --include="*.ts" -l 2>/dev/null; then
            echo "❌ Possible API keys found"
            exit 1
          fi
          echo "✅ No credentials detected"