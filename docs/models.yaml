# ─── Runtime Defaults ───────────────────────────────────────────────
# What each runtime uses if an agent has no explicit assignment.
# Per-agent override (above) takes precedence over these defaults.
runtime_defaults:
  claude:
    primary: claude-sonnet-4
    fallbacks: [claude-haiku-4-5]
  opencode:
    primary: ollama-glm-5-2
    fallbacks: [ollama-qwen3-coder]
  codex:
    primary: inherit  # uses codex config.toml model (minimax-m3)
    fallbacks: []
  hermes:
    primary: auto  # uses hermes provider routing
    fallbacks: []
  openclaw:
    primary: claude-sonnet-4
    fallbacks: [claude-haiku-4-5]

# ─── Eval Policy ────────────────────────────────────────────────────
# CLASSIC framework (Aisera): Cost, Latency, Accuracy, Stability, Security, Intelligence.
# Three-level assessment (AWS/Amazon): end-to-end, trajectory, component.
eval:
  cadence: weekly
  fixtures_dir: allura-plugins/evals/fixtures/
  results_dir: allura-plugins/evals/results/
  metrics:
    - cost          # token_count × model price
    - latency       # time-to-first-token + end-to-end
    - accuracy      # task completion success rate
    - stability     # consistency across N runs
    - security      # Allura governance gate pass rate (POL-001–006)
    - intelligence   # LLM-as-judge on reasoning quality
  pass_threshold: 0.85   # 85% to pass
  ship_threshold: 0.90    # 90% to ship without caveats
  canary_days: 7          # new models run in eval for 7 days before production
  comparison_baseline: last  # compare to previous run

# ─── Model Lifecycle ───────────────────────────────────────────────
# Deprecation watch, migration path, canary period, rollback triggers.
lifecycle:
  deprecation_warning_days: 90
  migration_path: "deprecation → canary → promotion → rollback"
  rollback_on:
    - eval_fail
    - latency_regression_gt_20pct
    - cost_regression_gt_15pct
    - security_gate_fail
  new_model_canary:
    duration_days: 7
    agents: [scout, woz]  # canary on low-risk agents first
    promote_on: [eval_pass, no_regression]

# ─── Cost-Aware Routing (future) ────────────────────────────────────
# RouteLLM/vLLM Semantic Router pattern: a small classifier model routes
# each turn to the best agent model. Cuts costs ~48% (RouteLLM benchmark).
# Not implemented yet — Phase 5 experiment after static registry is stable.
semantic_routing:
  enabled: false
  classifier_model: claude-haiku-4-5
  route_on: [complexity, task_type, context_length]
  fallback_to: static  # if classifier unavailable, use static assignment