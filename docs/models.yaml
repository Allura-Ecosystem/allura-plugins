# Allura Model Registry — the single source of truth for agent→model mapping
#
# Referenced by all runtimes (Claude, OpenCode, Codex, Hermes, OpenClaw).
# Synced by models-update-all.sh. Evaluated by models-eval.sh.
# Monitored by models-performance.sh.
#
# Pattern: one registry file at a well-known location (arxiv 2508.03095).
# Centralized management, not scattered per-agent YAML (Solace Agent Mesh).
# Per-agent override > global default (OpenClaw). Fallback chains for
# resilience (OpenClaw, RouteLLM). Aliases per runtime (OpenClaw models.json).
# CLASSIC eval framework (Aisera). Three-level assessment (AWS/Amazon).
# Canary before promotion (industry standard). Cost-aware routing (RouteLLM).
#
# Last updated: 2026-07-16
# Author: Brooks (Chief Architect)

# ─── Model Definitions ─────────────────────────────────────────────
# Each model has: provider, tier, context_window, cost_per_1m_tokens,
# latency_profile, runtime availability, and per-runtime aliases.
# Cost is USD per 1M tokens. latency_profile: low (<2s), medium (2-5s), high (>5s).
models:
  claude-opus-4-8:
    provider: anthropic
    tier: ultrabrain
    context_window: 200000
    cost_per_1m_input: 15.00
    cost_per_1m_output: 75.00
    latency_profile: high
    available_in: [claude, opencode, openclaw]
    aliases:
      claude: opus
      opencode: anthropic/claude-opus-4-8
      openclaw: anthropic/claude-opus-4-8
    status: active

  claude-sonnet-4:
    provider: anthropic
    tier: builder
    context_window: 200000
    cost_per_1m_input: 3.00
    cost_per_1m_output: 15.00
    latency_profile: medium
    available_in: [claude, opencode, openclaw]
    aliases:
      claude: sonnet
      opencode: anthropic/claude-sonnet-4
      openclaw: anthropic/claude-sonnet-4
    status: active

  claude-haiku-4-5:
    provider: anthropic
    tier: recon
    context_window: 200000
    cost_per_1m_input: 0.80
    cost_per_1m_output: 4.00
    latency_profile: low
    available_in: [claude, opencode, openclaw]
    aliases:
      claude: haiku
      opencode: anthropic/claude-haiku-4-5
      openclaw: anthropic/claude-haiku-4-5
    status: active

  ollama-glm-5-2:
    provider: ollama
    tier: ultrabrain
    context_window: 128000
    cost_per_1m_input: 0.00
    cost_per_1m_output: 0.00
    latency_profile: medium
    available_in: [opencode]
    aliases:
      opencode: ollama/glm-5.2:cloud
    status: active

  ollama-qwen3-coder:
