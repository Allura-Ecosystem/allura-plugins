# Catalog policy, not a second model registry. No model IDs or prices are guessed here.
schema_version: 2
authority:
  team_ram: https://github.com/Allura-Ecosystem/allura-team-ram
  team_ram_registry: tooling/agent-sync/models.map.json
  team_durham: https://github.com/Allura-Ecosystem/team-durham
  team_durham_registry: agents frontmatter and adaptive workflow policy
  other_plugins: canonical source declared in SOURCE.json or source-locks.json
  changes: Edit canonical source, validate, commit, pin source-locks.json, regenerate export.
  generated_exports: read_only
  installed_caches: never_modified_by_catalog_scripts
runtime_defaults:
  claude: inherit
  opencode: omit agent model to inherit the configured primary or global model
  codex: omit agent model to retain the configured session model
  other_hosts: retain configured host selection; no model routing adapter claimed
capability_criteria:
  discovery: reliable retrieval, extraction, scope and tool selection
  implementation: accepted code or copy, successful validation, low rework
  reasoning: architecture, ambiguous failures, independent review
  visual: image understanding and inspection of actual deliverables
selection:
  default: configured host model
  overrides: explicit supported source-owned bindings validated against current provider docs
  compare: same task class, acceptance criteria, tool permissions and context revision
  metrics: [accepted_outcomes, retries, review_findings, latency, measured_cost]
  missing_measurements: unknown, never zero or a fabricated pass
  prices: cite provider and retrieval date in an actual benchmark receipt
  promotion: human approval where required; model confidence is not acceptance evidence
commands:
  audit: bash scripts/models-update-all.sh --dry-run
  evaluation_plan: bash scripts/models-eval.sh --dry-run
  performance_plan: bash scripts/models-performance.sh --dry-run
  execution: no benchmark runner or Brain telemetry collector is implemented by these scripts
